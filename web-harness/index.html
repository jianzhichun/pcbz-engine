<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PCBZ wasm page harness</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #272b34; }
    #pcbcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #pcbcraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #dee2e8; font: 14px system-ui, sans-serif; background: #272b34; z-index: 10; }
  </style>
</head>
<body>
  <canvas id="pcbcraft_canvas"></canvas>
  <div id="pcbcraft_loading" role="status">Loading PCBZ&hellip;</div>
  <script src="./host.js"></script>
  <script type="module">
    import init, * as app from '__APP_JS__';
    window.__pcbzApp = app;
    window.__pcbzHarness.initStarted = performance.now();
    try {
      // Trunk hashes the wasm file; init must be given that path (trunk's own autoload does this).
      await init({ module_or_path: '__WASM_URL__' });
      window.__pcbzHarness.initMs = performance.now() - window.__pcbzHarness.initStarted;
      window.__pcbzHarness.inited = true;
    } catch (error) {
      window.__pcbzHarness.inited = 'error';
      window.__pcbzHarness.errors.push('init: ' + String(error));
    }
  </script>
</body>
</html>

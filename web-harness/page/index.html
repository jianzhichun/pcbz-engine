<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- The page has no outbound network: scripts, worker and wasm are its own origin's; the plugin's routes are same-origin.
       `wasm-unsafe-eval` is required for WebAssembly.compile/instantiate; no Threads/SharedArrayBuffer (no COOP/COEP). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; base-uri 'none'">
  <title>PCBZ 编辑界面</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #272b34; }
    #pcbz-stage { position: absolute; inset: 0; overflow: hidden; }
    #pcbz-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    /* A 1px, transparent text field holds the keyboard and IME while the editor edits text (eframe's text-agent role).
       It is focusable from script only; the canvas forwards clicks to it, so no pointer event is lost. */
    #pcbz-text { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; outline: none;
      resize: none; overflow: hidden; opacity: 0; pointer-events: none; font-size: 16px; }
    #pcbz-loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 4;
      color: #dee2e8; background: #272b34; font: 14px/1.6 system-ui, -apple-system, "Noto Sans SC", sans-serif; }
    #pcbz-banner { position: absolute; top: 8px; left: 8px; right: 8px; z-index: 5; display: none;
      max-width: 100%; padding: 6px 10px; border-radius: 6px; word-break: break-all;
      color: #e6e8ec; background: #1e2128; border: 1px solid #3a3f4a; pointer-events: none;
      font: 13px/1.5 system-ui, -apple-system, "Noto Sans SC", sans-serif; }
    #pcbz-banner[data-kind="read-only"] { border-color: #8a6d1f; }
    #pcbz-banner[data-kind="error"] { border-color: #a33a32; }
  </style>
</head>
<body>
  <main id="pcbz-stage" aria-label="PCBZ 编辑界面">
    <canvas id="pcbz-canvas"></canvas>
    <textarea id="pcbz-text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>
  </main>
  <div id="pcbz-loading" role="status">正在打开编辑界面…</div>
  <div id="pcbz-banner" role="status"></div>
  <script type="module" src="./pcbz-page.js"></script>
</body>
</html>

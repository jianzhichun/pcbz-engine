# Build the upstream browser editor (apps/pcbcraft-web: eframe drawing egui on a canvas) as
# WebAssembly for the PCBZ page, then prove the host bridge end to end in headless Chrome:
# serve the harness, open the sensor-node example through the page's own load export, make one
# edit through its command export, save through its save export (patch 0011), and reopen the
# saved archive with the pinned pcbcraft-cli. Uploads dist/web, the before/after screenshots,
# the save diff summary, sizes and load timing.
#
# wasm32-unknown-unknown, trunk pinned to 0.21.14 (the version upstream CI uses) with the
# index.html's wasm-opt -Oz, on ubuntu-24.04, which also has Chrome for playwright-core.
# engine.yml (the CLI and its release path) is untouched.
name: wasm-page
on:
  push:
    branches: [wasm-page, release]
    tags: ['engine-*']
    paths: ['scripts/i18n_check.py', 'scripts/i18n_non_ui.json', 'patches/**', 'web-harness/**', 'UPSTREAM_COMMIT', '.github/workflows/wasm-page.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wasm-page-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wasm-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      TRUNK_VERSION: v0.21.14
    steps:
      - uses: actions/checkout@v4
      - name: upstream at the pinned commit, with every patch
        shell: bash
        run: |
          commit=$(tr -d '[:space:]' < UPSTREAM_COMMIT)
          git init -q upstream
          git -C upstream fetch -q --depth 1 https://github.com/tangency-labs/pcbcraft.git "$commit"
          git -C upstream checkout -q FETCH_HEAD
          [ "$(git -C upstream rev-parse HEAD)" = "$commit" ] || { echo "fetched the wrong commit"; exit 1; }
          for p in patches/*.patch; do git -C upstream apply --verbose "../$p"; done
      - name: Chinese catalog scan and remaining-English count
        shell: bash
        run: python3 scripts/i18n_check.py . --max-english 0 2>&1 | tee i18n.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          prefix-key: wasm-page
          cache-on-failure: true
      - name: Install trunk at the pinned version
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          trunk --version
      - name: Build the web app
        working-directory: upstream/apps/pcbcraft-web
        # `proof` adds the CJK overlay and the worker probe the proof below checks; the shipping
        # build (M-wasm3) omits it.
        run: trunk build --release --locked --features proof
      - name: Put the PCBZ page into dist/web (worker entry, hashed app manifest)
        run: node web-harness/prepare-page.mjs --dist upstream/dist/web --page web-harness/page
      - name: Record the dist sizes
        run: |
          du -ab upstream/dist/web | sort -n | tail -25 | tee sizes.txt
          find upstream/dist/web -maxdepth 1 -type f -printf '%f %s\n' | sort -k2 -n | tee -a sizes.txt
      - name: Harness dependencies (playwright-core against the runner's Chrome, pngjs)
        working-directory: web-harness
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Build the CLI that reopens this build's saves
        working-directory: upstream
        # The project format can advance. A CLI from an older release is not a valid reader for
        # this build's save, and a same-tag download would race the independent engine workflow.
        run: cargo build --locked --release -p pcbcraft-cli
      - name: 'Headless proof: load, edit, save, reopen with the CLI'
        run: |
          CLI=upstream/target/release/pcbcraft-cli
          node web-harness/run.mjs --dist upstream/dist/web --project upstream/examples/sensor-node.pc --out proof --cli "$CLI"
      - name: 'Worker proof: OffscreenCanvas frames, CJK pixels, save through the plugin routes'
        run: |
          CLI=upstream/target/release/pcbcraft-cli
          node web-harness/worker-run.mjs --dist upstream/dist/web --project upstream/examples/sensor-node.pc --out proof --cli "$CLI"
      - name: Brotli the wasm (the compressed form is what ships; design 1.4)
        run: node web-harness/brotli-dist.mjs --dist upstream/dist/web | tee proof/wasm-brotli.json
      - name: Upload the build and the proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-page
          path: |
            proof/
            upstream/dist/web/
            sizes.txt
          if-no-files-found: error
          retention-days: 7
  archive:
    if: startsWith(github.ref, 'refs/tags/engine-')
    needs: [wasm-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm-page
          path: art
      - name: archive
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -euo pipefail
          tag=${GITHUB_REF_NAME}; commit=${tag#engine-}; commit=${commit%-*}; n=${tag##*-}
          [ -f art/upstream/dist/web/index.html ] || { ls -R art | head; exit 1; }
          name=pcbcraft-web-0.1.0-${commit}-$n
          mkdir -p "dist/$name"; cp -r art/upstream/dist/web "dist/$name/web"; cp art/proof/wasm-brotli.json "dist/$name/" 2>/dev/null || true
          (cd dist && tar -czf "$name.tar.gz" "$name" && rm -rf "$name" && ls -l)
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS-wasm.txt; cat SHA256SUMS-wasm.txt
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes "PCBCraft programs and the wasm page built from tangency-labs/pcbcraft with patches/." || true
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *

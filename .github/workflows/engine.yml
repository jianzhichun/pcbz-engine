# Build pcbcraft-cli (the headless MCP engine) from tangency-labs/pcbcraft at the commit in UPSTREAM_COMMIT,
# with the patches in patches/, for Linux x64, macOS (Apple silicon) and Windows x64 on GitHub-hosted runners.
# Pushes to main and manual runs produce artifacts only. A pushed tag engine-<first 9 of UPSTREAM_COMMIT>-<n>
# (for example engine-2ff33c653-1) also publishes a GitHub Release with:
#   pcbcraft-cli-<cargo version>-<commit9>-<n>-{linux-x64.tar.gz,macos-arm64.tar.gz,windows-x64.zip}
#   SHA256SUMS.txt
# Each archive holds one folder: the binary, <binary>.sha256, LICENSE-MIT, LICENSE-APACHE, ATTRIBUTION.md,
# THIRD-PARTY-LICENSES.txt, the applied patches and SOURCE.txt (upstream commit and patch digests).
name: engine
on:
  push:
    branches: [main]
    tags: ['engine-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux-x64, exe: '' }
          - { os: macos-15, target: macos-arm64, exe: '' }
          - { os: windows-2025, target: windows-x64, exe: '.exe' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # the C runtime linked in: a Windows machine without the VC++ redistributable cannot start the program otherwise
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - name: upstream at the pinned commit, patched
        shell: bash
        run: |
          commit=$(tr -d '[:space:]' < UPSTREAM_COMMIT)
          git init -q upstream
          git -C upstream fetch -q --depth 1 https://github.com/tangency-labs/pcbcraft.git "$commit"
          git -C upstream checkout -q FETCH_HEAD
          [ "$(git -C upstream rev-parse HEAD)" = "$commit" ] || { echo "fetched the wrong commit"; exit 1; }
          for p in patches/*.patch; do git -C upstream apply --verbose "../$p"; done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: build
        shell: bash
        working-directory: upstream
        run: |
          start=$(date +%s)
          cargo build --locked --release -p pcbcraft-cli
          echo "build_seconds=$(( $(date +%s) - start ))"
          "target/release/pcbcraft-cli${{ matrix.exe }}" --version
      - name: smoke (handshake, snapshot, reopen)
        shell: bash
        run: python scripts/smoke.py "upstream/target/release/pcbcraft-cli${{ matrix.exe }}" "$RUNNER_TEMP/smoke"
      - name: archive
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          commit=$(tr -d '[:space:]' < UPSTREAM_COMMIT)
          exe=pcbcraft-cli${{ matrix.exe }}
          cargo_version=$("upstream/target/release/$exe" --version | awk '{print $2}')
          if [[ "$GITHUB_REF" == refs/tags/engine-* ]]; then
            rest=${GITHUB_REF_NAME#engine-}
            [ "${rest%%-*}" = "${commit::9}" ] || { echo "tag $GITHUB_REF_NAME does not name UPSTREAM_COMMIT $commit"; exit 1; }
            build=${rest#*-}
          else
            build=g${GITHUB_SHA::7}
          fi
          name=pcbcraft-cli-$cargo_version-${commit::9}-$build-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp "upstream/target/release/$exe" "dist/$name/"
          (cd "dist/$name" && (sha256sum "$exe" 2>/dev/null || shasum -a 256 "$exe") > "$exe.sha256")
          cp upstream/LICENSE-MIT upstream/LICENSE-APACHE upstream/ATTRIBUTION.md patches/*.patch "dist/$name/"
          (cd upstream && python ../scripts/licences.py "../dist/$name/THIRD-PARTY-LICENSES.txt")
          {
            echo "pcbcraft-cli built from https://github.com/tangency-labs/pcbcraft at $commit"
            echo "with these patches applied (sha256):"
            for p in patches/*.patch; do (sha256sum "$p" 2>/dev/null || shasum -a 256 "$p"); done
          } > "dist/$name/SOURCE.txt"
          cd dist
          if [ -n "${{ matrix.exe }}" ]; then 7z a -tzip -bd "$name.zip" "$name" > /dev/null; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/engine-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          [ "$(ls | wc -l)" = 3 ] || { ls; echo "expected three archives"; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # the render server's workflow releases the same tag: create the release if it is missing, else add to it
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes "pcbcraft-cli built from tangency-labs/pcbcraft at the commit in UPSTREAM_COMMIT, with patches/. See SOURCE.txt in each archive." || true
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *

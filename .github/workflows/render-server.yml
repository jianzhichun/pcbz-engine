# Build pcbcraft-render-server (the editing UI drawn with no window, speaking the wire protocol of
# render-server/PROTOCOL.md) from tangency-labs/pcbcraft at the commit in UPSTREAM_COMMIT, with patches/, on
# Linux x64 (lavapipe), Windows x64 (WARP) and macOS (Apple silicon, Metal). It also builds pcbcraft-cli in the same
# run (the bridge and the editor must agree on the control protocol), then:
#   - the M1 snapshot smoke (frame PNGs, no window);
#   - the M2 proof: scripts/stream_proof.py is a scripted host that connects over leg A, receives frames, clicks, types,
#     drives the control channel with `pcbcraft-cli mcp --connect` (project.rename, snapshot_project, edit.undo), checks the
#     entry points the host owns (patch 0010) and repeats the edits against a read-only session (Linux: under strace);
# and uploads the frames, the protocol log, the timings and the logs as artifacts. engine.yml (the CLI and its release
# path) is not touched. Run it by hand with `targets` to build only some platforms while iterating.
name: render-server
on:
  push:
    branches: [render-server]
    paths: ['render-server/**', 'patches/**', 'scripts/png_check.py', 'scripts/stream_proof.py', 'UPSTREAM_COMMIT', '.github/workflows/render-server.yml']
  workflow_dispatch:
    inputs:
      profile:
        description: 'fast: no LTO, 256 codegen units (iterating); release: the repo profile (what would ship)'
        default: fast
      targets:
        description: 'platforms to build, any of: linux-x64 windows-x64 macos-arm64'
        default: 'linux-x64 windows-x64 macos-arm64'
permissions:
  contents: read
concurrency:
  group: render-server-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          every = [
              {"os": "ubuntu-24.04", "target": "linux-x64", "exe": "", "adapter": "software"},
              {"os": "windows-2025", "target": "windows-x64", "exe": ".exe", "adapter": "software"},
              {"os": "macos-15", "target": "macos-arm64", "exe": "", "adapter": "auto"},
          ]
          want = (os.environ.get("TARGETS") or "linux-x64 windows-x64 macos-arm64").split()
          print("matrix=" + json.dumps({"include": [m for m in every if m["target"] in want]}))
          EOF
  snapshot:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      PCBZ_RENDER_LOG: info
    steps:
      - uses: actions/checkout@v4
      - name: upstream at the pinned commit, patched, with the render server
        shell: bash
        run: |
          commit=$(tr -d '[:space:]' < UPSTREAM_COMMIT)
          git init -q upstream
          git -C upstream fetch -q --depth 1 https://github.com/tangency-labs/pcbcraft.git "$commit"
          git -C upstream checkout -q FETCH_HEAD
          [ "$(git -C upstream rev-parse HEAD)" = "$commit" ] || { echo "fetched the wrong commit"; exit 1; }
          for p in patches/*.patch; do git -C upstream apply --verbose "../$p"; done
          cp -R render-server upstream/apps/pcbcraft-render-server
          # the workspace-level part of the render server: the root Cargo.toml (the rfd shim replaces rfd) and the lock entries
          # that follow from it and from the new member. Kept out of patches/ because engine.yml builds the CLI with --locked
          # from a tree that has no render server.
          rm upstream/apps/pcbcraft-render-server/workspace.patch upstream/apps/pcbcraft-render-server/Cargo.lock.patch
          git -C upstream apply --verbose ../render-server/workspace.patch
          git -C upstream apply --verbose ../render-server/Cargo.lock.patch
      - name: Linux software Vulkan (lavapipe) and a Chinese font
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mesa-vulkan-drivers vulkan-tools fonts-wqy-microhei strace
          vulkaninfo --summary || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          prefix-key: render-server-${{ github.event.inputs.profile || 'fast' }}
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: build (the editor and the CLI together)
        shell: bash
        working-directory: upstream
        run: |
          if [ "${{ github.event.inputs.profile || 'fast' }}" = fast ]; then
            export CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=256
          fi
          rustc --version
          start=$(date +%s)
          cargo build --locked --release -p pcbcraft-cli -p pcbcraft-render-server 2>&1 | tee ../build.log
          build_seconds=$(( $(date +%s) - start ))
          bin=target/release/pcbcraft-render-server${{ matrix.exe }}
          size=$(wc -c < "$bin" | tr -d ' ')
          {
            echo "target=${{ matrix.target }} profile=${{ github.event.inputs.profile || 'fast' }}"
            echo "build_seconds=$build_seconds"
            echo "binary_bytes=$size"
          } | tee ../metrics.txt
      - name: keep the Linux binaries (host-side tests run them against lavapipe)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          mkdir -p bin
          cp upstream/target/release/pcbcraft-render-server upstream/target/release/pcbcraft-cli bin/
      - name: unit tests (host loop pieces, rfd shim)
        if: matrix.target == 'linux-x64'
        shell: bash
        working-directory: upstream
        run: |
          export CARGO_PROFILE_TEST_DEBUG=0
          cargo test --locked --release -p pcbcraft-render-server -p rfd 2>&1 | tee ../test.log
      - name: snapshot smoke (sensor-node, no window)
        shell: bash
        run: |
          mkdir -p out recovery
          export PCBCRAFT_RECOVERY_DIR="$PWD/recovery"
          unset DISPLAY WAYLAND_DISPLAY || true
          bin="upstream/target/release/pcbcraft-render-server${{ matrix.exe }}"
          "$bin" --version 2>&1 | tee smoke.log
          set +e
          "$bin" --snapshot out --frames 2 --size 960x600 --adapter ${{ matrix.adapter }} \
            --project upstream/examples/sensor-node.pc 2>&1 | tee -a smoke.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit=$code" | tee -a smoke.log
          [ "$code" = 0 ]
          ls -l out
          python scripts/png_check.py out/frame-0001.png 960 600 500 2>&1 | tee -a smoke.log
          python scripts/png_check.py out/frame-0002.png 960 600 500 2>&1 | tee -a smoke.log
          cat out/frames.json
          # the small pane the M1 check names (640x400), checked the same way
          "$bin" --snapshot out-640 --frames 1 --size 640x400 --adapter ${{ matrix.adapter }} \
            --project upstream/examples/sensor-node.pc 2>&1 | tee -a smoke.log
          python scripts/png_check.py out-640/frame-0001.png 640 400 500 2>&1 | tee -a smoke.log
      - name: stream proof (a scripted host over leg A, the control channel, read-only)
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p proof
          unset DISPLAY WAYLAND_DISPLAY || true
          extra=""
          [ "${{ matrix.target }}" = macos-arm64 ] && extra="--mac"
          # Linux: the server runs under strace; it must start no other program and connect to nothing beyond loopback
          [ "${{ matrix.target }}" = linux-x64 ] && extra="--strace"
          python scripts/stream_proof.py \
            --server "upstream/target/release/pcbcraft-render-server${{ matrix.exe }}" \
            --cli "upstream/target/release/pcbcraft-cli${{ matrix.exe }}" \
            --project upstream/examples/sensor-node.pc --project2 upstream/examples/dual-led.pc --out proof --adapter ${{ matrix.adapter }} --size 960x600 $extra 2>&1 | tee proof.log
          exit "${PIPESTATUS[0]}"
      - name: frame cost over 20 frames (informational)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p out-perf recovery
          export PCBCRAFT_RECOVERY_DIR="$PWD/recovery"
          unset DISPLAY WAYLAND_DISPLAY || true
          "upstream/target/release/pcbcraft-render-server${{ matrix.exe }}" --snapshot out-perf --frames 20 --gap-ms 0 --size 960x600 --adapter ${{ matrix.adapter }} \
            --project upstream/examples/sensor-node.pc 2> perf.log
          python -c "
          import json, statistics
          d = json.load(open('out-perf/frames.json'))
          for k in ('pass', 'paint', 'readback', 'encode'):
              v = sorted(f['timing'][k] for f in d['frames'])
              print(k, 'median %.1f ms, max %.1f ms' % (statistics.median(v), v[-1]))
          " | tee perf.txt
      - name: no helper process, no dialog, no network beyond loopback (strace, informational)
        if: matrix.target == 'linux-x64'
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get install -y -q strace
          mkdir -p out-strace recovery
          export PCBCRAFT_RECOVERY_DIR="$PWD/recovery"
          unset DISPLAY WAYLAND_DISPLAY || true
          strace -f -qq -e trace=execve,connect -o strace.log upstream/target/release/pcbcraft-render-server --snapshot out-strace --frames 1 --size 640x400 --adapter software --project upstream/examples/sensor-node.pc 2> strace-run.log
          echo "execve:"; grep -c execve strace.log || true
          grep -E 'execve|connect' strace.log | grep -vE 'ENOENT|resumed' | head -40 || true
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }}"
            echo '```'
            cat metrics.txt 2>/dev/null
            tail -n 12 smoke.log 2>/dev/null
            tail -n 45 proof.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-server-${{ matrix.target }}
          path: |
            out/
            out-640/
            proof/
            proof.log
            smoke.log
            strace.log
            perf.txt
            perf.log
            out-perf/frames.json
            strace-run.log
            build.log
            test.log
            metrics.txt
            bin/
          if-no-files-found: warn
          retention-days: 14
      - name: the proof must have passed
        if: steps.proof.outcome == 'failure'
        shell: bash
        run: |
          echo "the stream proof failed; see proof.log and proof/report.json in the artifact"
          exit 1
